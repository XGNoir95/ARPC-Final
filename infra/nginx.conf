upstream arpc_api {
    least_conn;
    server api1:4000 max_fails=2 fail_timeout=10s;
    server api2:4000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The public deployment never serves administrator entry points.
    location ~* ^/(login|register|forgot-password|reset-password|verify-email|admin)(/|$) {
        return 404;
    }
    location ~* ^/api/(auth|admin|config|access)(/|$) {
        return 404;
    }
    location /api/ {
        proxy_pass http://arpc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_cache off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(jpg|jpeg|png|webp|svg|ttf|woff2?)$ {
        try_files $uri =404;
        expires 10m;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
