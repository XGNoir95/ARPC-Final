name: Bug report
description: Report a reproducible problem with the ARPC website.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page URL and the actions that trigger the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: "Windows 11, Chrome, 1440 × 900"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove passwords, tokens and private member information before sharing.
