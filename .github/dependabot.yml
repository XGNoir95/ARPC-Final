version: 2
updates:
  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
      application-patches:
        dependency-type: production
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
