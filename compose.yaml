# Local scale-testing stack. It uses a separate persistent database from dev:local.
x-api: &api
  build:
    context: .
    dockerfile: Backend/Dockerfile
  env_file:
    - path: Backend/.env
      required: false
  environment: &environment
    NODE_ENV: development
    PORT: 4000
    API_LISTEN_HOST: 0.0.0.0
    ADMIN_ACCESS_MODE: disabled
    MONGODB_URI: mongodb://mongo:27017/arpc
    REDIS_URL: redis://redis:6379
    FRONTEND_URL: http://localhost:8080
    TRUST_PROXY: 1
    MAIL_WORKER_ENABLED: "false"
    UPLOAD_DIR: /app/uploads
  volumes:
    - uploads:/app/uploads
  depends_on:
    mongo: {condition: service_healthy}
    redis: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5
  restart: unless-stopped
services:
  mongo:
    image: mongo:8.0
    volumes: ["mongo:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api1:
    <<: *api
  api2:
    <<: *api
  mail:
    <<: *api
    stop_grace_period: 40s
    command: ["node", "src/worker.js"]
    healthcheck: {disable: true}
  edge:
    build:
      context: .
      dockerfile: infra/Dockerfile.edge
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mongo:
  redis:
  uploads:
